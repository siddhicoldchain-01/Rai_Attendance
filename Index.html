<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>RAI Attendance | Siddhi Cold Chain</title>
    <style>
        /* Mobile-First CSS */
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #ffffff; margin:0; padding: 0; text-align: center; color: #1f2937; -webkit-font-smoothing: antialiased; }
        .app-wrapper { display: flex; flex-direction: column; min-height: 100vh; padding: 25px 20px; box-sizing: border-box; justify-content: center; }
        
        h2 { color: #1a73e8; font-size: 26px; margin-bottom: 5px; margin-top: 0; font-weight: 800; }
        .subtitle { color: #6b7280; font-size: 15px; margin-top: 0; margin-bottom: 25px; }
        
        #login-view, #face-view, #app-ui { display: none; animation: fadeIn 0.4s ease-in-out; width: 100%; max-width: 450px; margin: 0 auto; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Face ID Camera Style */
        .camera-container { display: flex; flex-direction: column; align-items: center; margin: 20px 0; }
        .camera-box { width: 260px; height: 340px; background: #000; border-radius: 140px; overflow: hidden; border: 6px solid #f3f4f6; box-shadow: 0 15px 35px rgba(0,0,0,0.15); position: relative; }
        /* Mirrored video for natural selfie feel */
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        /* Cool Scanning Animation */
        .scanner-line { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: rgba(26, 115, 232, 0.9); box-shadow: 0 0 15px 2px rgba(26, 115, 232, 0.6); animation: scan 2.5s infinite alternate ease-in-out; display: none; }
        @keyframes scan { 0% { top: 10%; } 100% { top: 90%; } }

        /* Modern Buttons */
        .btn { width: 100%; padding: 18px; border-radius: 16px; font-size: 17px; font-weight: 700; border: none; cursor: pointer; transition: all 0.2s; margin-bottom: 12px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn:active { transform: scale(0.97); }
        .btn-in { background: #10b981; color: white; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25); }
        .btn-out { background: #ef4444; color: white; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.25); }
        .btn-reg { background: #2563eb; color: white; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25); }
        .btn:disabled { background: #e5e7eb; color: #9ca3af; box-shadow: none; cursor: not-allowed; transform: none; }

        /* Modern Inputs */
        input[type="email"] { width: 100%; padding: 18px 20px; border-radius: 14px; border: 2px solid #e5e7eb; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; outline: none; transition: border 0.3s; background: #f9fafb; }
        input[type="email"]:focus { border-color: #2563eb; background: #ffffff; }

        /* Info Cards */
        .info-card { background: #f8fafc; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; text-align: left; }
        .user-name { font-size: 1.2rem; font-weight: 800; color: #1f2937; }
        .user-id { color: #64748b; font-size: 14px; margin-top: 4px; }
        
        /* New Mini Buttons inside Info Card */
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-small { flex: 1; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn-small:active { transform: scale(0.95); }
        .btn-leave { background: #dbeafe; color: #2563eb; } /* Blue theme */
        .btn-logout { background: #fee2e2; color: #dc2626; } /* Red theme */
        
        #status-indicator { font-weight: 700; margin: 15px 0; font-size: 15px; padding: 12px; border-radius: 10px; background: #f3f4f6; }
        #ai-msg { font-size: 15px; font-weight: 600; margin-top: 15px; color: #4b5563; }
        
        /* History Section */
        .history-box { margin-top: 25px; text-align: left; }
        .history-title { font-weight: 700; font-size: 14px; margin-bottom: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        .brand { display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap; margin: 0 auto 28px; color: #24445e; font-weight: 750; }
        .brand img { display: block; width: 140px; height: auto; }
        .history-table { width: 100%; border-spacing: 0; overflow: hidden; border: 1px solid #dbe5ee; border-radius: 12px; font-size: 13px; }
        .history-table th, .history-table td { padding: 11px 8px; text-align: left; vertical-align: top; border-bottom: 1px solid #e2e8f0; }
        .history-table thead { color: #3f5b70; background: #eef4fa; }
        .history-table tr:last-child td { border-bottom: 0; }
        .history-table td:first-child { font-weight: 650; }
        .punch-location, .history-note { color: #55677b; font-size: 12px; }
        .punch-location { display: block; overflow-wrap: anywhere; margin-top: 3px; }
        .attendance-month { display: block; font-size: 13px; margin-bottom: 10px; }
        .attendance-month input { margin-left: 5px; }
        .attendance-month[hidden] { display: none; }
        .attendance-table-wrap { overflow-x: auto; }
        .request-action { color: #18559a; background: #e9f2ff; }
        .request-status { display: block; font-weight: 700; }
        .request-note { display: block; margin: 3px 0; color: #526983; overflow-wrap: anywhere; }
        #correction-dialog { box-sizing: border-box; width: min(92vw, 400px); border: 1px solid #cbd9e7; border-radius: 14px; padding: 20px; text-align: left; }
        #correction-dialog::backdrop { background: #12243a80; }
        #correction-dialog label[hidden] { display: none; }
        #correction-dialog label { display: block; margin-bottom: 10px; font-weight: 650; font-size: 14px; }
        #correction-dialog input, #correction-dialog select, #correction-dialog textarea { display: block; box-sizing: border-box; width: 100%; margin-top: 4px; padding: 8px; border: 1px solid #aebed0; border-radius: 6px; font: inherit; }
        #correction-error { color: #962e35; font-size: 13px; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header class="brand">
            <img src="https://raw.githubusercontent.com/annikumar1237/Lawrence-Road/8f911338f823ae45982c7bec8921982dea1823c5/siddhi-logo.jpeg" alt="Siddhi Cold Chain" width="600" height="300">
            <span>RAI Attendance</span>
        </header>
        <div id="loading" style="font-weight: bold; color: #2563eb; display: none;">✨ Starting Portal...</div>
        
        <div id="login-view">
            <h2>Welcome</h2>
            <p class="subtitle">Enter your employee email to access the portal.</p>
            <input type="email" id="emailInput" placeholder="employee@company.com" inputmode="email">
            <button class="btn btn-reg" onclick="saveEmailAndLoad()">Continue</button>
        </div>

        <div id="face-view">
            <h2 id="face-title">Face ID</h2>
            <p class="subtitle">Please look directly at the camera</p>
            
            <div class="camera-container">
                <div class="camera-box">
                    <video id="video" autoplay playsinline muted></video>
                    <canvas id="canvas" style="display:none;"></canvas>
                    <div id="scanner" class="scanner-line"></div>
                </div>
                <div id="ai-msg">Initializing camera...</div>
            </div>

            <button id="retryCamera" class="btn btn-reg" style="display:none;" onclick="startCamera(config.isRegistered)">Retry Camera</button>
            <button id="regBtn" class="btn btn-reg" style="display:none;" onclick="captureAndRegister()">Capture & Register Face</button>
        </div>
        
        <div id="app-ui">
            <h2>Portal Unlocked</h2>
            <div class="info-card">
                <div class="user-name" id="uName"></div>
                <div class="user-id" id="uId"></div>
                <div class="action-buttons">
                    <button class="btn-small btn-leave" onclick="window.open('https://forms.gle/Ygb8twaV5zusTaAX8', '_blank')">Apply Leave</button>
                    <button class="btn-small btn-logout" onclick="logout()">Switch User</button>
                </div>
            </div>
            
            <div id="status-indicator">Checking Geofence...</div>
            <div id="note-area" style="display:none; background:#fef3c7; padding:12px; border-radius:10px; margin-bottom:15px; font-size:13px; color:#b45309; font-weight:600;"></div>
            
            <button id="btnIn" class="btn btn-in" onclick="mark('IN')" disabled>PUNCH IN</button>
            <button id="btnOut" class="btn btn-out" onclick="mark('OUT')" disabled>PUNCH OUT</button>
            
            <div id="feedback" style="margin-top:15px; font-weight:700; font-size: 15px;"></div>
            
            <div class="history-box">
                <div class="history-title">Date-wise Attendance</div>
                <label id="attendance-month-label" class="attendance-month" hidden>Month <input id="attendance-month" type="month"></label>
                <p id="attendance-message" class="history-note" role="status"></p>
                <div id="history-list" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <dialog id="correction-dialog">
        <form id="correction-form">
            <h3 id="correction-title">Attendance correction</h3>
            <p id="correction-recorded-in" hidden></p>
            <label id="correction-in-label">IN time <input id="correction-in" type="time" required></label>
            <label>OUT date <select id="correction-out-date" required></select></label>
            <label>OUT time <input id="correction-out" type="time" required></label>
            <label>Reason <textarea id="correction-reason" maxlength="500" rows="3" required></textarea></label>
            <p id="correction-error" role="alert"></p>
            <button type="submit" id="correction-submit" class="btn-small request-action">Submit to HR</button>
            <button type="button" id="correction-cancel" class="btn-small">Cancel</button>
        </form>
    </dialog>

    <script>
    // 👇👇 PASTE YOUR GOOGLE APPS SCRIPT URL HERE 👇👇
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxbwmwmzYZuX_tfvcT2W79S1uwUN1XfRk4_yQJwvQ_dg2FhjWg8kjevHB3_XiFzfoNLTQ/exec"; 
    
    let config = {}, activeLoc = "", latestPos = null, stream = null, userEmail = "";

    let employeeToken = "", selectedCorrectionDate = "", monthRequest = 0;
    let cameraSession = 0;
    const byId = id => document.getElementById(id);

    window.onload = () => {
        byId('attendance-month').addEventListener('change', loadAttendanceMonth);
        byId('correction-cancel').addEventListener('click', () => byId('correction-dialog').close());
        byId('correction-form').addEventListener('submit', submitCorrection);
        userEmail = localStorage.getItem("empEmail");
        if (userEmail) {
            loadData();
        } else {
            document.getElementById('login-view').style.display = 'block';
        }
    };

    function saveEmailAndLoad() {
        const email = document.getElementById('emailInput').value.trim();
        if(email === "") { alert("Please enter an email"); return; }
        localStorage.setItem("empEmail", email);
        userEmail = email;
        document.getElementById('login-view').style.display = 'none';
        loadData();
    }

    function logout() {
        localStorage.removeItem("empEmail");
        location.reload();
    }

    async function apiCall(action, payload = {}, quiet = false) {
        payload.action = action;
        payload.email = userEmail;
        try {
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload),
                signal: AbortSignal.timeout(90000)
            });
            if (!response.ok) throw new Error("Database returned HTTP " + response.status);
            return await response.json();
        } catch(e) {
            console.error("API Error", e);
            if (quiet) throw e;
            alert("Failed to connect to the database. Please try again.");
        }
    }

    async function loadData() {
        document.getElementById('loading').style.display = 'block';
        const data = await apiCall("getAppData");
        document.getElementById('loading').style.display = 'none';
        
        if(data && data.authorized) {
            config = data;
            document.getElementById('face-view').style.display = 'block';
            
            if (data.isRegistered) {
                document.getElementById('face-title').innerText = "Verifying...";
                document.getElementById('ai-msg').innerText = "Starting Camera...";
                startCamera(true); 
            } else {
                document.getElementById('face-title').innerText = "Register Face";
                document.getElementById('regBtn').style.display = 'block';
                startCamera(false);
            }
        } else {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerText = "Unauthorized Access";
            setTimeout(logout, 3000);
        }
    }

    async function startCamera(shouldVerify) {
        const session = ++cameraSession;
        if (stream) stream.getTracks().forEach(track => track.stop());
        const video = byId('video');
        const msg = byId('ai-msg');
        const regBtn = byId('regBtn');
        regBtn.disabled = true;
        byId('retryCamera').style.display = 'none';
        byId('scanner').style.display = 'none';
        msg.textContent = 'Starting camera…';
        msg.style.color = '#2563eb';
        try {
            if (!window.isSecureContext) throw new Error('Open this page using HTTPS to allow camera access.');
            if (!navigator.mediaDevices?.getUserMedia) throw new Error('Camera is unavailable. Open this link in Chrome or Safari.');
            const camera = await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }
            });
            if (session !== cameraSession) {
                camera.getTracks().forEach(track => track.stop());
                return;
            }
            stream = camera;
            video.srcObject = camera;
            await video.play();
            const readyDeadline = Date.now() + 15000;
            while (video.readyState < 2 || !video.videoWidth || !video.videoHeight) {
                if (session !== cameraSession) return;
                if (Date.now() > readyDeadline) throw new Error('Camera preview did not start. Tap Retry Camera.');
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            if (session !== cameraSession) return;
            regBtn.disabled = false;
            msg.textContent = shouldVerify ? 'Camera ready. Look straight ahead in good light.' : 'Camera ready. Tap Capture & Register Face.';
            if (!shouldVerify) return;
            byId('scanner').style.display = 'block';
            // Await each request before capturing again; a sleeping server can take time to wake up.
            while (session === cameraSession) {
                try {
                    const canvas = byId('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    const capturedPhoto = canvas.toDataURL('image/jpeg', 0.9);
                    msg.textContent = 'Verifying identity… Server startup may take up to 90 seconds.';
                    msg.style.color = '#2563eb';
                    let result;
                    if (config.inlineCorrections === true) {
                        result = await apiCall('verifyEmployeeFace', { photo: capturedPhoto }, true);
                    } else {
                        const master = config.masterPhotos?.[0];
                        if (!master) throw new Error('Registered face photo is missing. Contact HR to check your registration.');
                        const response = await fetch('https://rai-attendance-p7k2.onrender.com/verify', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ captured: capturedPhoto, master }),
                            signal: AbortSignal.timeout(90000)
                        });
                        result = await response.json();
                        if (!response.ok) throw new Error(result?.error || 'Face server returned HTTP ' + response.status);
                    }
                    if (session !== cameraSession) return;
                    if (result?.match && (result.token || result.success)) {
                        employeeToken = result.token || '';
                        msg.style.color = '#059669';
                        msg.textContent = '✅ Match Confirmed!';
                        byId('scanner').style.display = 'none';
                        accessGranted();
                        return;
                    }
                    if (result?.error) throw new Error(result.error);
                    msg.style.color = '#dc2626';
                    msg.textContent = 'Face did not match. Keep your full face visible in good light. Retrying…';
                } catch (err) {
                    if (session !== cameraSession) return;
                    msg.style.color = '#b45309';
                    msg.textContent = (err.name === 'TimeoutError' ? 'Face server took too long to respond.' : err.message || 'Face server could not be reached.') + ' Retrying…';
                }
                await new Promise(resolve => setTimeout(resolve, 4000));
            }
        } catch (err) {
            if (session !== cameraSession) return;
            if (stream) stream.getTracks().forEach(track => track.stop());
            msg.style.color = '#dc2626';
            msg.textContent = err.name === 'NotAllowedError'
                ? 'Camera permission is blocked. Allow Camera in browser site settings, then tap Retry Camera.'
                : err.name === 'NotFoundError' ? 'No camera found on this device.'
                : err.name === 'NotReadableError' ? 'Camera is busy. Close other camera apps, then tap Retry Camera.'
                : err.message;
            byId('retryCamera').style.display = 'flex';
        }
    }

    async function captureAndRegister() {
        const canvas = document.getElementById('canvas');
        const video = document.getElementById('video');
        const btn = document.getElementById('regBtn');
        if (video.readyState < 2 || !video.videoWidth || !video.videoHeight) {
            byId('ai-msg').textContent = "Camera is not ready. Tap Retry Camera.";
            byId('retryCamera').style.display = "flex";
            return;
        }
        if (btn.disabled) return;
        const session = cameraSession;
        btn.disabled = true;
        byId('retryCamera').disabled = true;
        const msg = byId('ai-msg');
        try {
            const photos = [];
            for (let i = 1; i <= 3; i++) {
                msg.textContent = `📸 Taking Photo ${i} of 3...`;
                await new Promise(resolve => setTimeout(resolve, 1500));
                if (session !== cameraSession || video.readyState < 2 || !video.videoWidth || !video.videoHeight) {
                    throw new Error('Camera stopped during capture. Tap Retry Camera and try again.');
                }
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                photos.push(canvas.toDataURL('image/jpeg', 0.8));
            }
            msg.textContent = 'Saving face registration… Please keep this page open.';
            const result = await apiCall('registerFace', { photos }, true);
            if (!result || result.error || result.success === false || result.ok === false) {
                throw new Error(result?.error || result?.message || result?.status || 'Registration was not saved. Please try again.');
            }
            // Confirm persistence with the backend instead of reloading into registration again.
            let saved;
            for (let attempt = 0; attempt < 3; attempt++) {
                msg.textContent = 'Checking that your face registration was saved…';
                saved = await apiCall('getAppData', {}, true);
                if (saved?.authorized && saved.isRegistered === true) break;
                if (attempt < 2) await new Promise(resolve => setTimeout(resolve, 2000));
            }
            if (!saved?.authorized || saved.isRegistered !== true) {
                const detail = typeof result === 'string' ? result
                    : [result.message, result.status].filter(value => typeof value === 'string').join(' · ');
                throw new Error('The server has not confirmed your face registration. Contact Aniket/HR to check the Apps Script registration and photo storage.' + (detail ? ' Server response: ' + detail.slice(0, 300) : ''));
            }
            config = saved;
            byId('regBtn').style.display = 'none';
            byId('face-title').textContent = 'Verifying…';
            msg.style.color = '#059669';
            msg.textContent = 'Face registration saved. Starting verification…';
            await startCamera(true);
        } catch (err) {
            msg.style.color = '#dc2626';
            msg.textContent = err.message || 'Registration failed. Please try again.';
        } finally {
            btn.disabled = false;
            byId('retryCamera').disabled = false;
        }
    }

    function accessGranted() {
        ++cameraSession;
        if(stream) stream.getTracks().forEach(t => t.stop());
        document.getElementById('face-view').style.display = 'none';
        document.getElementById('app-ui').style.display = 'block';
        document.getElementById('uName').innerText = config.user.name;
        document.getElementById('uId').innerText = "Emp ID: " + config.user.id;
        
        if (config.lockStatus.isLocked) {
            const note = document.getElementById('note-area');
            note.style.display = 'block';
            note.innerText = config.lockStatus.msg;
        }
        renderHistory(config.history);
        if (employeeToken) {
            const month = byId('attendance-month');
            month.max = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Kolkata' }).format(new Date()).slice(0, 7);
            month.value = month.max;
            byId('attendance-month-label').hidden = false;
            loadAttendanceMonth();
        }
        startGeofencing();
    }

    function groupHistory(history, today) {
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const days = new Map();
        const other = [];

        for (const item of history || []) {
            const match = /^(\d{1,2}) ([A-Za-z]{3}), (\d{1,2}):(\d{2}) (AM|PM)$/i.exec(item.time || '');
            const status = String(item.status || '').trim().toUpperCase();
            const month = match ? months.indexOf(match[2]) + 1 : 0;
            if (!month || !['IN', 'OUT'].includes(status)) {
                other.push(item);
                continue;
            }

            const monthDay = String(month).padStart(2, '0') + '-' + match[1].padStart(2, '0');
            const inferredYear = Number(today.slice(0, 4)) - Number(monthDay > today.slice(5));
            const date = item.date || inferredYear + '-' + monthDay;
            const minutes = (Number(match[3]) % 12 + (match[5].toUpperCase() === 'PM' ? 12 : 0)) * 60 + Number(match[4]);
            const order = Number(item.order) || minutes;
            const day = days.get(date) || { date, label: match[1] + ' ' + match[2] + ' ' + date.slice(0, 4) };
            const current = day[status];
            if (!current || (status === 'IN' ? order < current.order : order > current.order)) {
                day[status] = { clock: match[3] + ':' + match[4] + ' ' + match[5], loc: item.loc, order };
            }
            days.set(date, day);
        }

        return { days: [...days.values()].sort((a, b) => b.date.localeCompare(a.date)), other };
    }

    function renderHistory(history) {
        const list = document.getElementById('history-list');
        const today = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Kolkata' }).format(new Date());
        const { days, other } = groupHistory(history, today);
        list.replaceChildren();

        if (days.length) {
            const table = document.createElement('table');
            table.className = 'history-table';
            const header = table.createTHead().insertRow();
            for (const label of ['Date', 'IN', 'OUT']) {
                const cell = document.createElement('th');
                cell.scope = 'col';
                cell.textContent = label;
                header.append(cell);
            }
            const body = table.createTBody();
            for (const day of days) {
                const row = body.insertRow();
                row.insertCell().textContent = day.label;
                for (const status of ['IN', 'OUT']) {
                    const cell = row.insertCell();
                    const punch = day[status];
                    cell.textContent = punch?.clock || '—';
                    if (punch?.loc) {
                        const location = document.createElement('span');
                        location.className = 'punch-location';
                        location.textContent = punch.loc;
                        cell.append(location);
                    }
                }
            }
            list.append(table);
        }

        if (other.length || !days.length) {
            const note = document.createElement('p');
            note.className = 'history-note';
            note.textContent = other.length
                ? other.map(item => [item.time, item.status, item.loc].filter(Boolean).join(' · ')).join(' | ')
                : 'No recent punches to show.';
            list.append(note);
        }
    }

    function mergeAttendanceRows(monthlyRows, history, month, today) {
        const dates = new Map(monthlyRows.map(day => [day.date, day]));
        const missing = value => ['', 'blank', 'absent', 'leave', '-', '—']
            .includes(String(value ?? '').trim().toLowerCase());

        for (const punch of groupHistory(history, today).days) {
            if (!punch.date.startsWith(month + '-')) continue;
            const day = dates.get(punch.date) || { date: punch.date, eligible: false };
            if (day.requestType === 'OUT') continue;
            const inTime = missing(day.inTime) && punch.IN ? punch.IN.clock : day.inTime;
            const outTime = missing(day.outTime) && punch.OUT ? punch.OUT.clock : day.outTime;
            const status = missing(day.status) ? (punch.IN ? 'Present' : 'OUT recorded') : day.status;
            dates.set(punch.date, { ...day, inTime, outTime, status, eligible: false });
        }

        return [...dates.values()].sort((a, b) => b.date.localeCompare(a.date));
    }

    async function loadAttendanceMonth() {
        const month = byId('attendance-month').value;
        if (!month) return;
        const request = ++monthRequest;
        const message = byId('attendance-message');
        message.textContent = 'Loading attendance…';
        const result = await apiCall('getEmployeeCorrections', { token: employeeToken, month });
        if (request !== monthRequest) return;

        const today = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Kolkata' }).format(new Date());
        const loaded = Array.isArray(result?.days);
        const days = mergeAttendanceRows(loaded ? result.days : [], config.history, month, today);
        message.textContent = loaded ? (days.length ? '' : 'No attendance records for this month.')
            : (result?.error || 'Could not load correction requests. Reload and verify your face to try again.');
        renderAttendanceRows(days);
    }

    function renderAttendanceRows(days) {
        if (!days.length) {
            byId('history-list').replaceChildren();
            return;
        }
        const wrap = document.createElement('div');
        wrap.className = 'attendance-table-wrap';
        const table = document.createElement('table');
        table.className = 'history-table';
        const heading = table.createTHead().insertRow();
        for (const title of ['Date', 'IN', 'OUT', 'Status', 'Correction']) {
            const th = document.createElement('th');
            th.scope = 'col';
            th.textContent = title;
            heading.append(th);
        }
        const body = table.createTBody();
        for (const day of days) {
            const row = body.insertRow();
            for (const value of [day.date, day.inTime || '—', day.outTime || '—', day.status || 'Blank']) {
                row.insertCell().textContent = value;
            }
            const cell = row.insertCell();
            if (day.request) {
                const status = document.createElement('span');
                status.className = 'request-status';
                status.textContent = day.request === 'Pending' ? 'Pending HR review' : day.request;
                cell.append(status);
                if (day.note) {
                    const note = document.createElement('small');
                    note.className = 'request-note';
                    note.textContent = day.note;
                    cell.append(note);
                }
            }
            if (day.eligible) {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'btn-small request-action';
                button.textContent = day.requestType === 'OUT' ? 'Request OUT'
                    : day.request === 'Rejected' ? 'Request again' : 'Request correction';
                button.addEventListener('click', () => openCorrection(day));
                cell.append(button);
            } else if (!day.request) {
                cell.textContent = '—';
            }
        }
        wrap.append(table);
        byId('history-list').replaceChildren(wrap);
    }

    function openCorrection(day) {
        const { date } = day;
        const outOnly = day.requestType === 'OUT';
        selectedCorrectionDate = date;
        byId('correction-form').reset();
        byId('correction-in-label').hidden = outOnly;
        byId('correction-in').disabled = outOnly;
        byId('correction-in').required = !outOnly;
        byId('correction-recorded-in').hidden = !outOnly;
        byId('correction-recorded-in').textContent = outOnly ? 'Recorded IN · ' + day.inTime : '';
        byId('correction-title').textContent = (outOnly ? 'Request missing OUT · ' : 'Attendance correction · ') + date;
        byId('correction-error').textContent = '';
        const tomorrow = new Date(Date.parse(date + 'T00:00:00Z') + 86400000).toISOString().slice(0, 10);
        byId('correction-out-date').replaceChildren(
            new Option(date + ' (same day)', date),
            new Option(tomorrow + ' (next day)', tomorrow)
        );
        byId('correction-dialog').showModal();
    }

    async function submitCorrection(event) {
        event.preventDefault();
        const submit = byId('correction-submit');
        const cancel = byId('correction-cancel');
        submit.disabled = cancel.disabled = true;
        byId('correction-error').textContent = '';
        try {
            const result = await apiCall('submitEmployeeCorrection', {
                token: employeeToken, date: selectedCorrectionDate,
                inTime: byId('correction-in').value, outTime: byId('correction-out').value,
                outDate: byId('correction-out-date').value, reason: byId('correction-reason').value
            });
            if (result?.ok !== true) {
                byId('correction-error').textContent = result?.error || 'Could not submit. Please try again.';
                return;
            }
            byId('correction-dialog').close();
            await loadAttendanceMonth();
        } finally {
            submit.disabled = cancel.disabled = false;
        }
    }

    function startGeofencing() {
        navigator.geolocation.watchPosition(pos => {
            latestPos = pos;
            let isInside = false;
            for (let loc of config.locations) {
                let d = calculateDistance(pos.coords.latitude, pos.coords.longitude, loc.lat, loc.lng);
                if (d <= loc.radius) { isInside = true; activeLoc = loc.name; break; }
            }
            const st = document.getElementById('status-indicator');
            st.innerHTML = isInside ? "🟢 Within Range: " + activeLoc : "🔴 Outside Range";
            st.style.color = isInside ? "#059669" : "#dc2626";
            st.style.background = isInside ? "#d1fae5" : "#fee2e2";
            
            document.getElementById('btnIn').disabled = !isInside || config.lockStatus.isLocked;
            document.getElementById('btnOut').disabled = !isInside;
        }, null, { enableHighAccuracy: true });
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2-lat1)*Math.PI/180;
        const dLon = (lon2-lon1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function mark(type) {
        const btnLabel = type === 'IN' ? 'btnIn' : 'btnOut';
        const btn = document.getElementById(btnLabel);
        const originalText = btn.innerText;
        btn.innerText = "Processing...";
        btn.disabled = true;
        
        document.getElementById('feedback').innerText = "";
        
        const response = await apiCall("saveAttendance", {
            details: {
                empId: config.user.id, email: config.user.email,
                status: type, locName: activeLoc,
                lat: latestPos.coords.latitude, lng: latestPos.coords.longitude
            }
        });
        
        document.getElementById('feedback').style.color = "#059669";
        document.getElementById('feedback').innerText = "✅ " + response.status;
        setTimeout(() => location.reload(), 1500); 
    }
    </script>
