<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>RAI Attendance | Siddhi Cold Chain</title>
    <style>
        /* Mobile-First CSS */
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #ffffff; margin:0; padding: 0; text-align: center; color: #1f2937; -webkit-font-smoothing: antialiased; }
        .app-wrapper { display: flex; flex-direction: column; min-height: 100vh; padding: 25px 20px; box-sizing: border-box; justify-content: center; }
        
        h2 { color: #1a73e8; font-size: 26px; margin-bottom: 5px; margin-top: 0; font-weight: 800; }
        .subtitle { color: #6b7280; font-size: 15px; margin-top: 0; margin-bottom: 25px; }
        
        #login-view, #face-view, #app-ui { display: none; animation: fadeIn 0.4s ease-in-out; width: 100%; max-width: 450px; margin: 0 auto; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Face ID Camera Style */
        .camera-container { display: flex; flex-direction: column; align-items: center; margin: 20px 0; }
        .camera-box { width: 260px; height: 340px; background: #000; border-radius: 140px; overflow: hidden; border: 6px solid #f3f4f6; box-shadow: 0 15px 35px rgba(0,0,0,0.15); position: relative; }
        /* Mirrored video for natural selfie feel */
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        /* Cool Scanning Animation */
        .scanner-line { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: rgba(26, 115, 232, 0.9); box-shadow: 0 0 15px 2px rgba(26, 115, 232, 0.6); animation: scan 2.5s infinite alternate ease-in-out; display: none; }
        @keyframes scan { 0% { top: 10%; } 100% { top: 90%; } }

        /* Modern Buttons */
        .btn { width: 100%; padding: 18px; border-radius: 16px; font-size: 17px; font-weight: 700; border: none; cursor: pointer; transition: all 0.2s; margin-bottom: 12px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn:active { transform: scale(0.97); }
        .btn-in { background: #10b981; color: white; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25); }
        .btn-out { background: #ef4444; color: white; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.25); }
        .btn-reg { background: #2563eb; color: white; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25); }
        .btn:disabled { background: #e5e7eb; color: #9ca3af; box-shadow: none; cursor: not-allowed; transform: none; }

        /* Modern Inputs */
        input[type="email"] { width: 100%; padding: 18px 20px; border-radius: 14px; border: 2px solid #e5e7eb; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; outline: none; transition: border 0.3s; background: #f9fafb; }
        input[type="email"]:focus { border-color: #2563eb; background: #ffffff; }

        /* Info Cards */
        .info-card { background: #f8fafc; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; text-align: left; }
        .user-name { font-size: 1.2rem; font-weight: 800; color: #1f2937; }
        .user-id { color: #64748b; font-size: 14px; margin-top: 4px; }
        
        /* New Mini Buttons inside Info Card */
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-small { flex: 1; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn-small:active { transform: scale(0.95); }
        .btn-leave { background: #dbeafe; color: #2563eb; } /* Blue theme */
        .btn-logout { background: #fee2e2; color: #dc2626; } /* Red theme */
        
        #status-indicator { font-weight: 700; margin: 15px 0; font-size: 15px; padding: 12px; border-radius: 10px; background: #f3f4f6; }
        #ai-msg { font-size: 15px; font-weight: 600; margin-top: 15px; color: #4b5563; }
        
        /* History Section */
        .history-box { margin-top: 25px; text-align: left; }
        .history-title { font-weight: 700; font-size: 14px; margin-bottom: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        .brand { display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap; margin: 0 auto 28px; color: #24445e; font-weight: 750; }
        .brand img { display: block; width: 140px; height: auto; }
        .history-table { width: 100%; border-spacing: 0; overflow: hidden; border: 1px solid #dbe5ee; border-radius: 12px; font-size: 13px; }
        .history-table th, .history-table td { padding: 11px 8px; text-align: left; vertical-align: top; border-bottom: 1px solid #e2e8f0; }
        .history-table thead { color: #3f5b70; background: #eef4fa; }
        .history-table tr:last-child td { border-bottom: 0; }
        .history-table td:first-child { font-weight: 650; }
        .punch-location, .history-note { color: #55677b; font-size: 12px; }
        .punch-location { display: block; overflow-wrap: anywhere; margin-top: 3px; }
        .correction-link { display: inline-block; margin-top: 12px; padding: 9px 12px; background: #e9f2ff; color: #1c55a0; border-radius: 8px; font-weight: 700; font-size: 13px; }
        .correction-link[hidden] { display: none; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header class="brand">
            <img src="https://raw.githubusercontent.com/annikumar1237/Lawrence-Road/8f911338f823ae45982c7bec8921982dea1823c5/siddhi-logo.jpeg" alt="Siddhi Cold Chain" width="600" height="300">
            <span>RAI Attendance</span>
        </header>
        <div id="loading" style="font-weight: bold; color: #2563eb; display: none;">✨ Starting Portal...</div>
        
        <div id="login-view">
            <h2>Welcome</h2>
            <p class="subtitle">Enter your employee email to access the portal.</p>
            <input type="email" id="emailInput" placeholder="employee@company.com" inputmode="email">
            <button class="btn btn-reg" onclick="saveEmailAndLoad()">Continue</button>
        </div>

        <div id="face-view">
            <h2 id="face-title">Face ID</h2>
            <p class="subtitle">Please look directly at the camera</p>
            
            <div class="camera-container">
                <div class="camera-box">
                    <video id="video" autoplay playsinline muted></video>
                    <canvas id="canvas" style="display:none;"></canvas>
                    <div id="scanner" class="scanner-line"></div>
                </div>
                <div id="ai-msg">Initializing camera...</div>
            </div>

            <button id="regBtn" class="btn btn-reg" style="display:none;" onclick="captureAndRegister()">Capture & Register Face</button>
        </div>
        
        <div id="app-ui">
            <h2>Portal Unlocked</h2>
            <div class="info-card">
                <div class="user-name" id="uName"></div>
                <div class="user-id" id="uId"></div>
                <div class="action-buttons">
                    <button class="btn-small btn-leave" onclick="window.open('https://forms.gle/Ygb8twaV5zusTaAX8', '_blank')">Apply Leave</button>
                    <button class="btn-small btn-logout" onclick="logout()">Switch User</button>
                </div>
            </div>
            
            <div id="status-indicator">Checking Geofence...</div>
            <div id="note-area" style="display:none; background:#fef3c7; padding:12px; border-radius:10px; margin-bottom:15px; font-size:13px; color:#b45309; font-weight:600;"></div>
            
            <button id="btnIn" class="btn btn-in" onclick="mark('IN')" disabled>PUNCH IN</button>
            <button id="btnOut" class="btn btn-out" onclick="mark('OUT')" disabled>PUNCH OUT</button>
            
            <div id="feedback" style="margin-top:15px; font-weight:700; font-size: 15px;"></div>
            
            <div class="history-box">
                <div class="history-title">Date-wise Attendance</div>
                <div id="history-list" aria-live="polite"></div>
                <a class="correction-link" id="correction-link" hidden>Request a correction</a>
            </div>
        </div>
    </div>

    <script>
    // 👇👇 PASTE YOUR GOOGLE APPS SCRIPT URL HERE 👇👇
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxbwmwmzYZuX_tfvcT2W79S1uwUN1XfRk4_yQJwvQ_dg2FhjWg8kjevHB3_XiFzfoNLTQ/exec"; 
    
    let config = {}, activeLoc = "", latestPos = null, stream = null, userEmail = "";

    window.onload = () => {
        userEmail = localStorage.getItem("empEmail");
        if (userEmail) {
            loadData();
        } else {
            document.getElementById('login-view').style.display = 'block';
        }
    };

    function saveEmailAndLoad() {
        const email = document.getElementById('emailInput').value.trim();
        if(email === "") { alert("Please enter an email"); return; }
        localStorage.setItem("empEmail", email);
        userEmail = email;
        document.getElementById('login-view').style.display = 'none';
        loadData();
    }

    function logout() {
        localStorage.removeItem("empEmail");
        location.reload();
    }

    async function apiCall(action, payload = {}) {
        payload.action = action;
        payload.email = userEmail;
        try {
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            });
            return await response.json();
        } catch(e) {
            console.error("API Error", e);
            alert("Failed to connect to the database.");
        }
    }

    async function loadData() {
        document.getElementById('loading').style.display = 'block';
        const data = await apiCall("getAppData");
        document.getElementById('loading').style.display = 'none';
        
        if(data && data.authorized) {
            config = data;
            document.getElementById('face-view').style.display = 'block';
            
            if(data.isRegistered && data.masterPhotos.length > 0) {
                document.getElementById('face-title').innerText = "Verifying...";
                document.getElementById('ai-msg').innerText = "Starting Camera...";
                startCamera(true); 
            } else {
                document.getElementById('face-title').innerText = "Register Face";
                document.getElementById('regBtn').style.display = 'block';
                startCamera(false);
            }
        } else {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerText = "Unauthorized Access";
            setTimeout(logout, 3000);
        }
    }

    async function startCamera(shouldVerify) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert("Your browser does not support camera access.");
            return;
        }

        try {
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" } 
            });
            const video = document.getElementById('video');
            video.srcObject = stream;

            video.onloadedmetadata = () => { 
                video.play(); 
                if(shouldVerify) document.getElementById('scanner').style.display = 'block';
            };
            
            if(shouldVerify) {
                const interval = setInterval(async () => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    
                    const capturedPhoto = canvas.toDataURL('image/jpeg', 0.7);
                    const msg = document.getElementById('ai-msg');
                    msg.innerText = "⏳ Verifying Identity...";
                    msg.style.color = "#2563eb";

                    try {
                        const response = await fetch('https://rai-attendance-p7k2.onrender.com/verify', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                captured: capturedPhoto,
                                master: config.masterPhotos[0] 
                            })
                        });

                        const result = await response.json();

                        if (result.success && result.match) {
                            clearInterval(interval);
                            msg.style.color = "#059669";
                            msg.innerText = "✅ Match Confirmed!";
                            document.getElementById('scanner').style.display = 'none';
                            setTimeout(accessGranted, 1000); 
                        } else {
                            msg.style.color = "#dc2626";
                            msg.innerText = "❌ Match Failed. Scanning again...";
                        }
                    } catch (err) {
                        msg.innerText = "⚠️ Server connecting...";
                    }
                }, 4000);
            }
        } catch (err) { 
            alert("Camera Permission Denied. Please allow camera access in your browser settings.");
        }
    }

    async function captureAndRegister() {
        const canvas = document.getElementById('canvas');
        const video = document.getElementById('video');
        const btn = document.getElementById('regBtn');
        let photos = [];
        btn.disabled = true;
        
        for (let i = 1; i <= 3; i++) {
            document.getElementById('ai-msg').innerText = `📸 Taking Photo ${i} of 3...`;
            await new Promise(r => setTimeout(r, 1500));
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            photos.push(canvas.toDataURL('image/jpeg', 0.8));
        }
        
        document.getElementById('ai-msg').innerText = "⏳ Saving profile securely...";
        await apiCall("registerFace", { photos: photos });
        location.reload(); 
    }

    function accessGranted() {
        if(stream) stream.getTracks().forEach(t => t.stop());
        document.getElementById('face-view').style.display = 'none';
        document.getElementById('app-ui').style.display = 'block';
        document.getElementById('uName').innerText = config.user.name;
        document.getElementById('uId').innerText = "Emp ID: " + config.user.id;
        
        if (config.lockStatus.isLocked) {
            const note = document.getElementById('note-area');
            note.style.display = 'block';
            note.innerText = config.lockStatus.msg;
        }
        renderHistory(config.history);
        if (config.correctionsEnabled === true) {
            const link = document.getElementById('correction-link');
            link.href = SCRIPT_URL + '?rai=employee';
            link.hidden = false;
        }
        startGeofencing();
    }

    function groupHistory(history, today) {
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const days = new Map();
        const other = [];

        for (const item of history || []) {
            const match = /^(\d{1,2}) ([A-Za-z]{3}), (\d{1,2}):(\d{2}) (AM|PM)$/i.exec(item.time || '');
            const status = String(item.status || '').trim().toUpperCase();
            const month = match ? months.indexOf(match[2]) + 1 : 0;
            if (!month || !['IN', 'OUT'].includes(status)) {
                other.push(item);
                continue;
            }

            const monthDay = String(month).padStart(2, '0') + '-' + match[1].padStart(2, '0');
            const inferredYear = Number(today.slice(0, 4)) - Number(monthDay > today.slice(5));
            const date = item.date || inferredYear + '-' + monthDay;
            const minutes = (Number(match[3]) % 12 + (match[5].toUpperCase() === 'PM' ? 12 : 0)) * 60 + Number(match[4]);
            const order = Number(item.order) || minutes;
            const day = days.get(date) || { date, label: match[1] + ' ' + match[2] + ' ' + date.slice(0, 4) };
            const current = day[status];
            if (!current || (status === 'IN' ? order < current.order : order > current.order)) {
                day[status] = { clock: match[3] + ':' + match[4] + ' ' + match[5], loc: item.loc, order };
            }
            days.set(date, day);
        }

        return { days: [...days.values()].sort((a, b) => b.date.localeCompare(a.date)), other };
    }

    function renderHistory(history) {
        const list = document.getElementById('history-list');
        const today = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Kolkata' }).format(new Date());
        const { days, other } = groupHistory(history, today);
        list.replaceChildren();

        if (days.length) {
            const table = document.createElement('table');
            table.className = 'history-table';
            const header = table.createTHead().insertRow();
            for (const label of ['Date', 'IN', 'OUT']) {
                const cell = document.createElement('th');
                cell.scope = 'col';
                cell.textContent = label;
                header.append(cell);
            }
            const body = table.createTBody();
            for (const day of days) {
                const row = body.insertRow();
                row.insertCell().textContent = day.label;
                for (const status of ['IN', 'OUT']) {
                    const cell = row.insertCell();
                    const punch = day[status];
                    cell.textContent = punch?.clock || '—';
                    if (punch?.loc) {
                        const location = document.createElement('span');
                        location.className = 'punch-location';
                        location.textContent = punch.loc;
                        cell.append(location);
                    }
                }
            }
            list.append(table);
        }

        if (other.length || !days.length) {
            const note = document.createElement('p');
            note.className = 'history-note';
            note.textContent = other.length
                ? other.map(item => [item.time, item.status, item.loc].filter(Boolean).join(' · ')).join(' | ')
                : 'No recent punches to show.';
            list.append(note);
        }
    }

    function startGeofencing() {
        navigator.geolocation.watchPosition(pos => {
            latestPos = pos;
            let isInside = false;
            for (let loc of config.locations) {
                let d = calculateDistance(pos.coords.latitude, pos.coords.longitude, loc.lat, loc.lng);
                if (d <= loc.radius) { isInside = true; activeLoc = loc.name; break; }
            }
            const st = document.getElementById('status-indicator');
            st.innerHTML = isInside ? "🟢 Within Range: " + activeLoc : "🔴 Outside Range";
            st.style.color = isInside ? "#059669" : "#dc2626";
            st.style.background = isInside ? "#d1fae5" : "#fee2e2";
            
            document.getElementById('btnIn').disabled = !isInside || config.lockStatus.isLocked;
            document.getElementById('btnOut').disabled = !isInside;
        }, null, { enableHighAccuracy: true });
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2-lat1)*Math.PI/180;
        const dLon = (lon2-lon1)*Math.PI/180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function mark(type) {
        const btnLabel = type === 'IN' ? 'btnIn' : 'btnOut';
        const btn = document.getElementById(btnLabel);
        const originalText = btn.innerText;
        btn.innerText = "Processing...";
        btn.disabled = true;
        
        document.getElementById('feedback').innerText = "";
        
        const response = await apiCall("saveAttendance", {
            details: {
                empId: config.user.id, email: config.user.email,
                status: type, locName: activeLoc,
                lat: latestPos.coords.latitude, lng: latestPos.coords.longitude
            }
        });
        
        document.getElementById('feedback').style.color = "#059669";
        document.getElementById('feedback').innerText = "✅ " + response.status;
        setTimeout(() => location.reload(), 1500); 
    }
    </script>
</body>
</html>
